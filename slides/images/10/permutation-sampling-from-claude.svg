    <rect x="130" y="480" width="80" height="30" fill="#fff0f0" stroke="#666"/>
    <rect x="210" y="480" width="80" height="30" fill="white" stroke="#666"/>
    <rect x="290" y="480" width="80" height="30" fill="#fffaf0" stroke="#666"/>
    <text x="90" y="500" font-size="13" text-anchor="middle" fill="#2563eb">3.7</text>
    <text x="170" y="500" font-size="13" text-anchor="middle" fill="#2563eb" font-weight="bold">5.3</text>
    <text x="250" y="500" font-size="13" text-anchor="middle" fill="#2563eb">9.5</text>
    <text x="330" y="500" font-size="13" text-anchor="middle" fill="#dc2626">15.1</text>
    
